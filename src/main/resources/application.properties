spring.application.name=hospitalalert

# --- DATABASE CONFIGURATION (MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/hospitalAlert?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Format the SQL so it's readable (not a single long line)
spring.jpa.properties.hibernate.format_sql=true

# Show the actual values (parameters) bound to the "?" in SQL queries
logging.level.org.hibernate.orm.jdbc.bind=trace

# --- MAIL CONFIGURATION ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- SECURITY & OTP CONFIGURATION ---
# This pulls from your .env or Docker environment
app.security.system-secret=${SYSTEM_SECRET}


# Security logs (useful to see if JWT/OTP filters are being hit)
logging.level.org.springframework.security=debug

# Web/MVC logs (to see incoming requests and parameters)
logging.level.org.springframework.web=debug

# Transaction management (to see when database commits/rollbacks happen)
logging.level.org.springframework.orm.jpa=debug

# This will create a file named 'hospital-alert.log' in your project root
logging.file.name=hospital-alert.log


# --- ASYNC CONFIGURATION ---
# Required for your @Async email sending to work properly
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
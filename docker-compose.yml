services:
  # Database Service: The core storage for HospusAPP
  hospus-db:
    image: postgres:15-alpine
    container_name: hospus-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # Secure: Only accessible from the VM itself
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service: Your Spring Boot Gradle application
  hospus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospus-api
    restart: on-failure
    depends_on:
      - hospus-db
    ports:
      - "8080:8080" # Exposed to the VM/Public for your frontend/mobile apps
    environment:
      # Database Connection (uses service name 'hospus-db' as host)
      SPRING_DATASOURCE_URL: jdbc:postgresql://hospus-db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # Hibernate Config
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

      # Stateless OTP & Security
      SYSTEM_SECRET: ${SYSTEM_SECRET}

      # Mail Service
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USER}
      SPRING_MAIL_PASSWORD: ${MAIL_PASS}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

volumes:
  postgres_data: # Persists your database records even if containers are deleted